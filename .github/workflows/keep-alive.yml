name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          echo "Pinging ${{ vars.RENDER_URL }}/health"
          curl --fail --silent --max-time 30 "${{ vars.RENDER_URL }}/health" || true
